# ═══════════════════════════════════════════════════════════════════
# QUÊTE 2.1 « TES VALEURS » — SLOTS DE MIROIR ALIMENTÉS
# quete: 2.1 · session: 2026-09-28 · fiche-mutation: FM-013
# Miroir LOURD (24 items ≥ 15) → gabarit 300-450 mots (Constitution [7])
# ═══════════════════════════════════════════════════════════════════
slots:

  - id: S1-2.1
    nom: "Ton gouvernail"
    contenu: >-
      Bloc dominant + bloc discret, position dans le pool vivant
      (descriptif : « la plupart des membres hésitent ici », jamais
      « tu es au-dessus de la moyenne »).
    degres: "percentile par bloc"
    citations_exemples:
      - "quand tu as répondu que le bien-être de tes proches passe avant ton programme du jour (Q2.1-17)"

  - id: S2-2.1
    nom: "L'axe qui te tend"
    contenu: "Croisement Affirmation de soi × Dépassement de soi"
    degres: ["apaisé", "tendu", "tiré au cordeau"]
    citations_exemples:
      - "quand tu as dit viser d'abord des résultats visibles (Q2.1-07)"

  - id: S3-2.1
    nom: "Quand tes réponses se répondent"
    contenu: "Cohérence miroir R6"
    degres:
      ferme: "0 paire écartée"
      nuancee: "1 paire écartée"
      a_voix_basse: "≥ 2 paires écartées"
    regle_silence: >-
      Rappel des 2 réponses en toutes lettres UNIQUEMENT au degré
      « à voix basse » (≥ 2 paires) — au degré « nuancée », l'écart
      modéré ne s'affiche pas (règle de silence du système) — observation
      mineure transmise au comité.
    citations_exemples:
      - "rappel des 2 réponses écartées, mot pour mot — JAMAIS les codes"

  - id: S4-2.1
    nom: "L'étendue de ta loyauté"
    contenu: "BE × UN (signature SIG-2.1-04)"
    degres: ["resserrée", "nuancée", "étendue"]
    citations_exemples:
      - "quand tu as dit chercher d'abord à comprendre (Q2.1-19)"

verrous_de_slot:
  - "Aucun code, score ou sigle franchit le rendu (Constitution [3] — aucune métadonnée visible)."
  - "Les 4 items ▲ n'alimentent AUCUN slot (interdit structurel — la trame sécurité n'a pas d'étage de restitution, jamais au match, jamais dans les portraits, jamais au premium)."
  - "Volume d'ombre ≥ volume de lumière sur l'ensemble du miroir (Constitution [2])."
  - "Les croisements inter-mondes du DOMAINE DU SOI (M1×M2) sont interdits ici : ils vivent au Portrait de Domaine (Constitution [5])."
  - "Registre probabiliste : conséquences au conditionnel fréquentiel, jamais au futur certain."
  - "Percentiles : toujours descriptifs — comparaison normative interdite."
