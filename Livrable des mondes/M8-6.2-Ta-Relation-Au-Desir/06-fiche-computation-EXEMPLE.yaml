item: Q6.2-07
quete: "6.2 Ta relation au désir"
monde: M8                     # métadonnée — le code reste la clé (FM-011 v2)
statut_freemium: premium
acces: opt-in                 # V13 — opt-in strict, la récompense ouvre l'étage, jamais un châtiment
etage_revelation: 2           # V13 — étage 2 de l'Intime : activation à consentement MUTUEL des deux membres
chiffrement: maximal          # V13 — le plus élevé du projet (quête où vit COC) — jamais dans les exports
sortie: permanente            # V13 — toute réponse modifiable ou supprimable à tout moment
phase: "P2"                   # refonte l. 2005 — quête entière
format: likert5               # échelle 1-5 codée 1-5
