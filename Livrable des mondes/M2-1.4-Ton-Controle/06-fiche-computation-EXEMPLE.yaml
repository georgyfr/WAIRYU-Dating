# LIVRABLE 6 — FICHE DE COMPUTATION COMPLÈTE D'UN ITEM (modèle des 5 canaux)
# Item choisi : Q1.4-01 (carte, mono-dimension autocontrole, porteur du doublon longitudinal).

item: Q1.4-01
quete: "1.4 Ton contrôle sur toi-même"
monde: M2                     # métadonnée — le code reste la clé (FM-011 v2)
statut_freemium: gratuit
dimension: autocontrole       # mono-dimension — 8/8 items de la quête
enonce: "Quand je décide d'une limite — budget, écran, nourriture — je la tiens."
echelle: likert5              # 1 Pas du tout comme moi … 5 Tout à fait comme moi (Arbitrage 2)
orientation: D
recodage: null                # D → contribue tel quel (Arbitrage 1)
double_balise:
  carte_id: autocontrole
  signal_id: null             # AUCUNE trame dans la quête 1.4
computation:
  carte:
    contribution: "score_autocontrole (8 items — seuil d'items valides requis : À VALIDER PAR LE COMITÉ)"
    bloc: null                # mono-dimension — aucun bloc multi-dimensions
    etages_restants: [carte_quete, miroir_1_4, portrait_monde_M2, portrait_domaine_soi, integral]
  signal: null
  fiabilite:
    role: porteur_doublon
    doublon: Q1.4-01.r
    doublon_enonce: "Mes décisions de limites tiennent dans le temps."
    regle: "concordance longitudinale des deux réponses → QFI (fenêtre de re-passage : À VALIDER PAR LE COMITÉ)"
  modulation:
    - si: "score_autocontrole calculé"
      effet: >-
        modulateur transversal (Couche 3) : atténue l'impulsivité (1.5), module l'interprétation
        du profil financier (3.4), rejoint le facteur de confiance
    - si: "réponses de la tâche 1.5 disponibles"
      effet: >-
        l'écart déclaratif (1.4) vs comportemental (1.5) est lui-même un signal — le comportement
        prime progressivement (courbe J+90) — croisement inter-quêtes : ÉTAGE 3 uniquement,
        jamais au miroir de la quête seule (pondération et calendrier : À VALIDER PAR LE COMITÉ)
  ancrage:
    rappel_autorise: true
    forme: "en toutes lettres, 2e personne, sans code ni score"
    exemple: "quand tu as répondu que tes limites — budget, écran, nourriture — tiennent"

# NOTES
# - Ce modèle sert de gabarit pour les 8 items de la quête (les fiches condensées du tableau
#   01-tableau-des-items.md se déploient dans ce format complet).
# - signal_id est null pour les 8 items : la quête ne contient AUCUN item de trame — aucun
#   rappel_autorise: false n'a lieu d'être dans cette quête.
# - La modulation transversale (Couche 3) n'est PAS une signature : c'est une entrée de variable
#   (AC_D) consommée par d'autres couches. Les signatures qui consomment les variables de la quête
#   sont documentées au fichier 03-signatures-registre.md.
