# ═══════════════════════════════════════════════════════════════════
# CARTES DE LA QUÊTE 2.8 « TON SIGNE (JUSTE POUR LE JEU) » — BADGE MINIATURE (étage 1)
# Création : VAGUE 6 — Fin de la Boussole (2026-09-29).
# FORMAT SPÉCIAL : BADGE MINIATURE (titre + signe + 1 phrase légère) — PAS une
# carte standard : pas d'ombre, pas de tension, pas de portrait (exemption
# documentée — precedent 1.7 « écran spécial sans carte », ratification comité).
# ⚠ RÈGLE ABSOLUE (gravée) : le signe n'entre JAMAIS dans le score, JAMAIS dans
# le matching, JAMAIS dans aucun calcul — ni filtre, ni pondération, ni tie-break.
# ⚠ DISCLAIMER GRAVÉ inséparable de tout rendu : « Pour la conversation — la
# science, elle, est dans tes résultats. »
# Sélection : la variante EST la sélection du membre (1 clic) — partition exclusive
# + exhaustive par nature (12 signes + la branche silence).
# ═══════════════════════════════════════════════════════════════════

quete: "2.8 Ton signe (juste pour le jeu)"
monde: M3
statut_freemium: gratuit
format: "etage_1_carte_badge_miniature"
charte: "C1-C11 (mission VAGUE 5) — exemption de format documentée : badge miniature (1 phrase légère), hors bornes C7/clarté, sans ombre ni tension (precedent 1.7, ratification comité)"
exception_format: "badge miniature — exemption documentée (mission VAGUE 6, LOT 8)"

selection:
  variable: "la sélection Q2.8-01 du membre (1 clic, opt-in) — aucune inférence, aucun calcul"
  logique: "le signe choisi EST la variante rendue — zéro scoring, zéro classement"
  exhaustivite: "12 signes + « Je ne veux pas dire » = partition totale des choix possibles (C6 par nature) — la branche silence ne produit AUCUN badge et AUCUNE trace"
  non_participant: "RIEN d'autre ne participe : aucune autre quête, aucun score, aucun moteur — règle absolue"

# Rendu de l'écran de complétion (structure miniature) :
#   titre du badge → signe → phrase légère → disclaimer gravé
entete_ecran: "TON SIGNE — juste pour le jeu"
label_disclaimer: "Pour la conversation — la science, elle, est dans tes résultats."
pied_ecran: "Le badge s'affiche sur ton profil et dans la conversation — modifiable ou effaçable en un clic. · [Changer] · [Retirer le badge] · [Quête suivante]"
fenetre_sur_l_autre:
  - "F1 : Quelque part, quelqu'un répond à ces mêmes questions. Le jour où vos cartes se croiseront, elles auront beaucoup à se dire."
  - "F2 : Ce portrait n'est pas une fin — c'est ta façon d'être trouvé·e : par quelqu'un qui lira ta carte avant ton visage."

