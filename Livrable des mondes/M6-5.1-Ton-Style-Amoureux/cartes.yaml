    ombre: "Le feu ne brûle pas les mardis ordinaires. Le quotidien déçoit parfois, et l'autre peut se sentir en dessous face à quelqu'un qui vit en sommets. Le coût pour toi : confondre calme et fin du feu. Le coût pour l'autre : croire qu'un jour ordinaire ne suffit plus."
    tension_interieure: "vivre les sommets sans lire les jours ordinaires comme des fins."

