# ═══════════════════════════════════════════════════════════════════
# CARTES DE LA QUÊTE 5.1 « TON STYLE AMOUREUX » — 7 VARIANTES (étage 1)
# Création : ré-émission 2ᵉ génération, mission R-a (phase R — le dossier V11, jamais
# poussé, a été perdu au reset du bac à sable ; textes réécrits Wairyu, cadre gelé
# repris des enregistrements du worklog Task 21).
# Charte des cartes C1-C11 (mission VAGUE 5) — longueur standard 55-110 mots
# (portrait + ombre + tension), cible 77-99, vérifiée machine (script hors dépôt).
# Sélection : cascade SIG-5.1-01 — dominant = max des six scores de style (18 items,
# I recodés 6−r, normalisés 0-1) ; bande 0.10 → secondaire nommé au rendu du miroir ;
# étendue des six ≤ 0.10 → profil égalitaire/mixte ; quasi-égalité < 0.05 → départage
# au pivot puis à la 1re position de passation (bornes À VALIDER PAR LE COMITÉ).
# NEUTRALITÉ TYPOLOGIQUE STRICTE : les six façons d'aimer se valent — l'ombre est
# dans l'EXCÈS en couple, jamais dans la nature ; aucune façon supérieure ou inférieure.
# Kit unique par profil dominant (refonte). ZÉRO nom d'atelier de la typologie au
# rendu (nommage UI obligatoire : la passion, le jeu, l'amitié devenue amour, le
# pragmatisme, l'intensité, le don de soi) — contrôle machine affiné en mots entiers.
# AUCUNE trame dans cette quête : 5.1 n'héberge AUCUN signal ▲ — zéro contenu signal.
# Zéro vocabulaire clinique, aucun code, aucun sigle au rendu.
# ═══════════════════════════════════════════════════════════════════

quete: "5.1 Ton style amoureux"
monde: M6
statut_freemium: premium
format: "etage_1_carte"
charte: "C1-C11 (mission VAGUE 5) — longueur standard 55-110 mots (portrait + ombre + tension), cible 77-99"

selection:
  variable: "les six scores de style — Q5.1-01 → Q5.1-18, I recodés 6−r, normalisés 0-1 (variables, formules et cascade au 03 — moteur) ; la matrice des façons [MOTEUR SEUL] ne participe JAMAIS à la sélection ni au rendu"
  logique: "dominant = max des six · bande 0.10 : secondaire à ≤ 0.10 → nommé au slot S2 du miroir (jamais un deuxième portrait) · quasi-égalité < 0.05 → départage au pivot puis à la 1re position de passation · étendue des six ≤ 0.10 → profil égalitaire/mixte (7e variante)"
  bornes: "0.05 (écart) / bande 0.10 / étendue 0.10 — propositions À VALIDER PAR LE COMITÉ [9], provisoire concepteur — re-signature professionnelle avant bêta"
  exhaustivite: "8 sélections = partition totale des profils possibles — chaque résultat tombe dans exactement une variante (C6, vérifié machine) : 6 dominants + 1 égalitaire/mixte"
  non_participant: "la matrice des façons [MOTEUR SEUL] (cellules moteur au 03) ne participe JAMAIS à la sélection ni au rendu ; le pré-signal SIG-5.1-03 est ATTENDU V12, non calculé dans cette quête"

