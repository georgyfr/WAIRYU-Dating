    ombre: "La légèreté se lit mal quand l'autre est sérieux. Une vraie question répondue par une blague reste une question. Le coût pour toi : passer pour absent alors que tu es là. Le coût pour l'autre : ne pas savoir où il en est, et cesser de demander."
