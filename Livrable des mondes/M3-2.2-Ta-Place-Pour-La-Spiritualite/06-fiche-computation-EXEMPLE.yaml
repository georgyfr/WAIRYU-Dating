# LIVRABLE 6 — FICHE DE COMPUTATION COMPLÈTE D'UN ITEM (modèle des 5 canaux)
# Item choisi : Q2.2-01 (pratique du quotidien — l'angle le plus direct de la centralité).
# Fichier YAML strict (gabarit des 5 autres items : seuls énoncé, angle, orientation et ancrage changent).
item: Q2.2-01
quete: "2.2 Ta place pour la spiritualité"
monde: M3                     # métadonnée — le code reste la clé (FM-011 v2)
statut_freemium: gratuit
format: likert5               # Arbitrage 2 — échelle 1-5 codée 1-5
enonce: "La spiritualité occupe une place réelle dans ma semaine."
echelle: "1 Pas du tout comme moi · 2 Plutôt pas comme moi · 3 Neutre / je ne sais pas · 4 Plutôt comme moi · 5 Tout à fait comme moi"
orientation: D                # direct — contribue tel quel au score de son angle
dimension: pratique           # angle 1/3 : pratique réelle vs culturelle (paire R6 avec Q2.2-02)
type_mesure: trait_declaratif # déclarative directe — déguisement impossible, sans trame
double_balise:
  carte_id: centralite_2.2    # alimente la carte (3 variantes) et le miroir (3 profils)
  signal_id: SIG-2.2-01       # filtre enrichi (homophilie graduée) — moteur seul, jamais une élimination
computation:
  carte:
    role: score_de_quete
    regle: "SPIRIT_D = moyenne des 6 items (I recodés 6−r), normalisée 0-1 — choisit la variante (centrale/culturelle/absente)"
    rendu: etage_1_et_2        # carte (3 variantes) + miroir (3 profils)
  signal:
    role: filtre_enrichi
    mecanisme: >-
      l'écart de centralité entre deux profils (EC_SPIRIT) module le score de compatibilité,
      dans les deux sens — jamais un dealbreaker binaire : aucun seuil n'élimine, aucun écart
      ne coupe ; la ligne rouge religieuse déclarée vit ailleurs (Q2.3-04, hard constraint)
    rendu: moteur_seul         # aucune trace chez l'un ni chez l'autre
    condition: "pondération linéaire proposée — À VALIDER PAR LE COMITÉ [9]"
  fiabilite:
    role: paire_R6
    regle: >-
      |D_k − (6 − I_k)| >= 3 (recherche documentée) -> drapeau fiabilité sur l'angle,
      rappel en toutes lettres, score d'angle = moyenne des items valides + prudence
      (precedent SIG-2.1-02)
  modulation:
    - si: "paire R6 divergente sur un angle"
      effet: "angle mis en prudence au score — le rappel raconte les deux réponses sans reproche"
    - si: "centralité forte ET aucune ligne rouge religieuse (2.3-04)"
      effet: "le filtre enrichi joue normalement — module, n'élimine pas"
    - si: "mise à jour d'un profil du pool"
      effet: "compatibilités recalculées des deux côtés — fenêtre À VALIDER PAR LE COMITÉ"
  ancrage:
    rappel_autorise: true
    forme: "en toutes lettres, 2e personne — la place décrite, jamais une confession nommée, jamais un code"
    exemple: "quand tu as répondu que la spiritualité occupe une place réelle dans ta semaine"
notes:
  - >-
    Ce modèle sert de gabarit pour les 6 items. Seuls changent : énoncé, angle (pratique /
    choix de vie / transmission), orientation (recodage 6−r pour les I), ancrage.
  - >-
    Quête déclarative directe, déguisement impossible : aucune fiche de trame n'existe — aucun
    énoncé réservé, aucune balise de trame (vérifié au registre, n_trames = 0).
