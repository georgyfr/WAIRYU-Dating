variantes:
  - ordre: 1
    id: V1
    nom: "La Clarté intérieure"
    condition: "P ≥ 0.65 ET R ≥ 0.65"
    texte: |
      🧭 **QUÊTE ACCOMPLIE — « Tes émotions »**

      ### La Clarté intérieure

      Tu sais ce que tu ressens, tu sais ce que ça fait, tu sais comment ça passe. Tu as appris à nommer avant d'exploser, à accueillir avant de fuir. Cette clarté est rare — et elle se voit, même quand tu ne dis rien.

      **Ta zone d'ombre :** Tu peux te prendre pour un point final : certaines émotions se traversent avec de l'aide, pas seulement avec de la méthode.

      **Ta tension intérieure :** maîtriser sans contrôler.

      📊 Ton profil de voyage : **{X}%** complété
      🤝 **{Z} personnes** attendent en ce moment un profil aussi riche que le tien.

