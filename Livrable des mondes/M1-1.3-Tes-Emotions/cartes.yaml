      *{fenêtre sur l'autre}*
  - ordre: 2
    id: V2
    nom: "Le Volcan tendre"
    condition: "P ≥ 0.60 ET R < 0.40"
    texte: |
      🧭 **QUÊTE ACCOMPLIE — « Tes émotions »**

      ### Le Volcan tendre

      Tu ressens tout, fort et tôt — mais ce qui arrive ne demande pas toujours la permission. Tes émotions te traversent comme des saisons rapides. Ce que tu vis de débordant, d'autres l'appelleraient de la passion pure.

      **Ta zone d'ombre :** Les regrets après les coups de chaud, tu les connais. Le travail n'est pas de ressentir moins — c'est de prévenir.

      **Ta tension intérieure :** laisser la vague passer sans qu'elle emporte ce qui compte.

      📊 Ton profil de voyage : **{X}%** complété
      🤝 **{Z} personnes** attendent en ce moment un profil aussi riche que le tien.

      [Partager ma carte]  [Quête suivante]
      *{fenêtre sur l'autre}*
  - ordre: 3
    id: V3
    nom: "Le Réservoir"
    condition: "P < 0.40 ET X < 0.40"
    texte: |
      🧭 **QUÊTE ACCOMPLIE — « Tes émotions »**

      ### Le Réservoir

      Tes émotions existent — elles travaillent simplement en profondeur, sous la surface. Tu ne les dissèque pas, tu ne les affiches pas : tu les traverses. Ceux qui te connaissent bien savent lire les petits signes qui, chez toi, valent des déclarations.

      **Ta zone d'ombre :** Ce que tu ne dis pas, l'autre ne peut pas le deviner — et l'attente devient de la distance.

      **Ta tension intérieure :** exister pour toi sans disparaître pour l'autre.

      📊 Ton profil de voyage : **{X}%** complété
      🤝 **{Z} personnes** attendent en ce moment un profil aussi riche que le tien.

      [Partager ma carte]  [Quête suivante]
      *{fenêtre sur l'autre}*
  - ordre: 4
    id: V4
    nom: "Le Radiateur"
    condition: "X ≥ 0.65"
    texte: |
      🧭 **QUÊTE ACCOMPLIE — « Tes émotions »**

      ### Le Radiateur

      Chez toi, ça se voit et ça se dit. Tu félicites, tu consoles, tu célèbres les autres mieux que toi-même. Les gens se tournent naturellement vers toi — tu es un endroit où ça va mieux.

      **Ta zone d'ombre :** Tu donnes tellement d'espace aux émotions des autres que les tiennes finissent à la file d'attente.

      **Ta tension intérieure :** prendre soin des autres sans en faire ton adresse.

      📊 Ton profil de voyage : **{X}%** complété
      🤝 **{Z} personnes** attendent en ce moment un profil aussi riche que le tien.

      [Partager ma carte]  [Quête suivante]
      *{fenêtre sur l'autre}*
  - ordre: 5
    id: V5
    nom: "La Réserve"
    condition: "P ≥ 0.55 ET X < 0.45"
    texte: |
      🧭 **QUÊTE ACCOMPLIE — « Tes émotions »**

      ### La Réserve

      Tu ressens beaucoup — et tu montres peu. Tes émotions sont riches, tenues, intimes. Ce n'est pas de la froideur : c'est de la pudeur. Quand tu ouvres, c'est choisi, et ça vaut de l'or.

      **Ta zone d'ombre :** Ta pudeur peut être lue comme une distance — toi seul(e) sais que derrière, tout est vivant.

      **Ta tension intérieure :** laisser entrer sans tout ouvrir.

      📊 Ton profil de voyage : **{X}%** complété
      🤝 **{Z} personnes** attendent en ce moment un profil aussi riche que le tien.

      [Partager ma carte]  [Quête suivante]
      *{fenêtre sur l'autre}*
  - ordre: 6
    id: V6
    nom: "L'Apprenti·e"
    condition: "tout le reste"
    texte: |
      🧭 **QUÊTE ACCOMPLIE — « Tes émotions »**

      ### L'Apprenti·e

      Tu es en train d'apprendre à connaître ce qui bouge en toi — et c'est le chantier le plus utile qui soit. Parfois clair, parfois embrouillé : c'est le rythme normal. La bonne nouvelle : tout ce qui s'apprend t'attend.

      **Ta zone d'ombre :** Ne confonds pas "je ne sais pas ce que je ressens" et "je ne ressens rien" — la deuxième phrase est presque toujours fausse.

      **Ta tension intérieure :** avancer sans exiger d'arriver.

      📊 Ton profil de voyage : **{X}%** complété
