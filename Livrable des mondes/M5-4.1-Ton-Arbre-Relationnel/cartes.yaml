# ═══════════════════════════════════════════════════════════════════
# CARTES DE LA QUÊTE 4.1 « TON ARBRE RELATIONNEL » — 5 VARIANTES (étage 1)
# Création : mission V10.A (2026-09-29, WAT).
# Charte des cartes C1-C11 (mission VAGUE 5) — longueur standard 55-110 mots
# (portrait + ombre + tension), vérifiée machine (script hors dépôt).
# Sélection : lecture 2 axes (climat CLIMAT_D × loyautés LOYAUTE_D) — 4 quadrants
# + central, partition exclusive + exhaustive par axe le plus dévié (SIG-4.1-01,
# C6, vérifiée machine). NEUTRALITÉ DES ORIGINES : les cinq façons d'avoir grandi
# se valent — le climat deviné n'est pas un climat raté, l'héritage pesant n'est
# pas une immaturité. ZÉRO BLÂME PARENTAL (interdit V10 — vérifié machine).
# AUCUNE trace des 2 trames hébergées du bloc 4.4 (moteur seul — verrou 04 n° 5).
# Zéro vocabulaire clinique, aucun code, aucun sigle au rendu.
# ═══════════════════════════════════════════════════════════════════

quete: "4.1 Ton arbre relationnel"
monde: M5
statut_freemium: gratuit
format: "etage_1_carte"
charte: "C1-C11 (mission VAGUE 5) — longueur standard 55-110 mots (portrait + ombre + tension)"

selection:
  variable: "deux axes déclarés — climat CLIMAT_D (4 items) et loyautés LOYAUTE_D (4 items), I recodés 6−r, normalisés 0-1 — Q4.1-01 → Q4.1-08 ; la part FIS_41 (2 trames hébergées, moteur seul) ne participe JAMAIS à la sélection"
  logique: "dC = |CLIMAT_D − 0.5| · dL = |LOYAUTE_D − 0.5| · max(dC, dL) ≤ 0.15 → central · sinon l'axe le plus dévié choisit le quadrant (4 variantes) · départage dC = dL : l'axe climat tranche"
  bornes: "déviations 0.15 (proposition) — reprises des zones moteur ADOPTÉES (FM-019), provisoire concepteur — re-signature professionnelle avant bêta"
  exhaustivite: "5 sélections = partition totale du carré [0,1]² — chaque profil tombe dans exactement une variante (C6, vérifié machine)"
  non_participant: "la variable FIS (bloc 4.4, matrice moteur — SIG-4.4-06) ne participe JAMAIS à la sélection ni au rendu ; les croisements de la matrice non plus"

# Rendu de l'écran de complétion (structure du gabarit standard) :
#   entête → titre de variante → portrait → « Ta zone d'ombre : » → « Ta tension intérieure : »
#   → pied ({X}% compteur réel · {Z} personnes · boutons · {fenêtre sur l'autre})
entete_ecran: "🌳 QUÊTE ACCOMPLIE — « Ton arbre relationnel »"
label_ombre: "Ta zone d'ombre :"
label_tension: "Ta tension intérieure :"
pied_ecran: "📊 Ton profil de voyage : {X}% complété · 🤝 {Z} personnes attendent en ce moment un profil aussi riche que le tien. · [Partager ma carte] · [Quête suivante] · {fenêtre sur l'autre}"
fenetre_sur_l_autre:
  - "F1 : Quelque part, quelqu'un construit son arbre aussi. Le jour où vos cartes se croiseront, elles auront beaucoup à se dire."
  - "F2 : Ce portrait n'est pas une fin — c'est ta façon d'être trouvé·e : par quelqu'un qui lira ta carte avant ton visage."

variantes:

  - id: CARTE-4.1-TABLE-QUI-DIT
    nom: "Le·La Table où ça se dit"
    ordre_selecteur: 1
    condition: "CLIMAT_D > 0.65 × LOYAUTE_D < 0.35 (climat nommé × voix tenue)"
    ancre_item: ["Q4.1-01", "Q4.1-02", "Q4.1-03", "Q4.1-04", "Q4.1-05", "Q4.1-06", "Q4.1-07", "Q4.1-08"]
    portrait: "Chez toi, les mots circulaient — les émotions se disaient, les désaccords se réparaient. Et ta voix à toi tient : elle compte autant que la paix du groupe. Tu viens d'une table où parler était normal, et tu y as gardé ta place."
    ombre: "Là où tout se dit, tout s'attend à une réponse vite. Un partenaire qui digère en silence peut te sembler un mur — et ton attente lui peser."
    tension_interieure: "garder ta table chaleureuse, en laissant à l'autre le temps de ses mots."

  - id: CARTE-4.1-ROLE-LUMIERE
    nom: "Le·La Rôle dans la lumière"
    ordre_selecteur: 2
    condition: "CLIMAT_D > 0.65 × LOYAUTE_D > 0.65 (climat nommé × héritage pesant)"
    ancre_item: ["Q4.1-01", "Q4.1-02", "Q4.1-03", "Q4.1-04", "Q4.1-05", "Q4.1-06", "Q4.1-07", "Q4.1-08"]
    portrait: "Tout se disait chez toi — et tu as tôt tenu le rôle qu'on t'a confié. Tu sais porter une place, une attention, une fiabilité que les tiens reconnaissent. La table parlait, et toi tu tenais la maison."
    ombre: "Le rôle tenu tôt devient un habit qui ne s'enlève plus. En couple, tu risques d'assumer tout et de ne rien demander — la fatigue du fiable se cache bien."
    tension_interieure: "nommer une chose que tu ne portes plus — la table tient sans ça."

  - id: CARTE-4.1-LECTEUR-SILENCES
    nom: "Le·La Lecteur de silences"
    ordre_selecteur: 3
    condition: "CLIMAT_D < 0.35 × LOYAUTE_D < 0.35 (climat deviné × voix tenue)"
    ancre_item: ["Q4.1-01", "Q4.1-02", "Q4.1-03", "Q4.1-04", "Q4.1-05", "Q4.1-06", "Q4.1-07", "Q4.1-08"]
    portrait: "Chez toi, l'essentiel se devinait plus qu'il ne se disait — tu as appris à lire une maison. Et ton avis compte autant que la paix du groupe : tu sais où tu vas sans avoir besoin qu'on le nomme."
    ombre: "Celui qui a appris à deviner devine encore. Un regard devient un reproche, une pause devient une décision — et l'autre se sent compris avant d'avoir parlé."
    tension_interieure: "poser ta lecture en question, jamais en verdict — la réponse appartient à l'autre."

  - id: CARTE-4.1-PLACE-HERITEE
    nom: "Le·La Place héritée"
    ordre_selecteur: 4
    condition: "CLIMAT_D < 0.35 × LOYAUTE_D > 0.65 (climat deviné × héritage pesant)"
    ancre_item: ["Q4.1-01", "Q4.1-02", "Q4.1-03", "Q4.1-04", "Q4.1-05", "Q4.1-06", "Q4.1-07", "Q4.1-08"]
    portrait: "Tu as appris tôt à lire une maison et à la porter à la fois — la place qu'il fallait tenir, tu l'as tenue. La paix du groupe passe souvent avant ton avis : une fidélité profonde qui garde debout ce qui compte."
    ombre: "La place tenue tôt pèse en silence. En couple, l'attente se déplace : l'autre devient la table qu'on ne veut pas troubler — et ton avis s'accumule."
    tension_interieure: "dire une chose que tu penses et que tu n'as pas dite — la paix y gagne d'être vraie."

  - id: CARTE-4.1-SELON-LA-TABLE
    nom: "Le·La Selon la table"
    ordre_selecteur: 5
    condition: "max(dC, dL) ≤ 0.15 (central — selon la table)"
    ancre_item: ["Q4.1-01", "Q4.1-02", "Q4.1-03", "Q4.1-04", "Q4.1-05", "Q4.1-06", "Q4.1-07", "Q4.1-08"]
    portrait: "Ton origine ne vote ni silence ni parole, ni rôle ni voix : selon les maisons et les années, tu t'adaptes. Tu dis quand c'est juste, tu devines quand c'est utile, tu tiens quand il faut."
    ombre: "La souplesse se lit mal de dehors : le partenaire cherche ta règle du moment. Elle existe — elle se devine mal, et l'attente peut peser."
    tension_interieure: "donner un mot de ta règle du moment — l'autre y trouve la porte."

regles_documentees:
  - "comptage des mots : tokens contenant au moins une lettre, champ = portrait + ombre + tension_interieure — bornes standard 55-110, vérifié machine (script hors dépôt)"
  - "neutralité des origines : les 5 variantes se valent — le climat nommé jamais « sain », le climat deviné jamais « blessé », l'héritage jamais une « immaturité », la voix jamais une « réparation » (contrôles machine)"
  - "ZÉRO blâme parental au rendu (interdit V10) — aucun parent, aucune faute d'agent : vérifié machine"
  - "zéro vocabulaire clinique (« différenciation », « loyauté familiale », « schéma ») au rendu — vérifié machine"
  - "AUCUNE trace des trames FIS (bloc 4.4) : aucun mot des 2 énoncés hors dépôt ne figure dans les textes rendus — vérifié machine (garde hors dépôt)"
  - "registre probabiliste : aucun futur certain (« risque », « peut » — présent fréquentiel)"
  - "C4 : aucun superlatif — aucune origine dressée en idéal"
  - "C8 : point médian dans les titres genrés · « (e) » dans le corps · métaphores d'objet exemptées du médian (précédent VAGUE 5)"
