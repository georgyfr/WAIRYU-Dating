# 🗒️ quete: 8.1 · dossier: M11-8.1-Les-Questions-Qui-Rapprochent · fiche: première émission V14.B.1 (FM à graver à la consolidation) · session: 2026-10-01
# ═══════════════════════════════════════════════════════════════════
# FICHE DE COMPUTATION — QUÊTE 8.1 « LES QUESTIONS QUI RAPPROCHENT »
# M11 « LE VOYAGE À DEUX » — 🆓 GRATUIT · MVP · débloquée au premier match
# LE MOTEUR NORTH STAR : conversion match → conversation → relation.
# 36 questions ouvertes (verbatim gelé — identique au 01-tableau-des-items.md),
# 3 niveaux × 12, ordre fixe scénarique, graine SANS-OBJET (aucune permutation).
# Mode À DEUX : 1 question par jour, la même pour le couple, chacun répond de
# son côté — les deux réponses se révèlent seulement après la double réponse
# (révélation mutuelle consentie — SIG-8.1-02, structurelle).
# Réponses croisées (texte libre) → analyse de compatibilité réelle (NLP P2)
# post-niveau-3 — [MOTEUR SEUL] ⛔ VERROU DUR : aucun score rendu à l'écran
# avant calibration du comité (interdit mission explicite — SIG-8.1-01).
# Exemption documentée : PAS de miroir individuel (07), PAS de cartes
# individuelles (04) — les récompenses sont partagées (refonte l. 2039).
# ═══════════════════════════════════════════════════════════════════
quete: "8.1"
titre: "Les questions qui rapprochent"
monde: M11                     # métadonnée — le code reste la clé (FM-011 v2)
monde_nom: "LE VOYAGE À DEUX"
statut_freemium: gratuit       # Constitution [5] : M11 toujours gratuit · [6] : la rencontre n'est jamais payante
phase: mvp                     # refonte PARTIE 8 l. 2032 — la première quête post-match en production
acces: premier-match           # la quête s'ouvre au premier match — la destination du voyage
mode: a-deux                   # missions progressives à deux — l'unité de passation est le couple
recompense: partagee           # la récompense est la réponse de l'autre — aucune carte individuelle
format: texte_libre            # pas de Likert, pas de D/I, pas de paires R6 (divergence de gabarit documentée au 00)
langue: fr                     # 36 questions 100 % Wairyu, en français
ordre: fixe-scenarique         # Q8.1-01 → Q8.1-36 — identique pour tous les couples
graine: sans-objet             # aucune permutation, aucune course, aucune config ci/quetes/8.1.json (documenté au 02)
deblocage:
  principe: sequentiel         # les niveaux se débloquent en séquence
  regle: "le niveau N+1 s'ouvre quand les 12 questions du niveau N sont complétées PAR LES DEUX partenaires"
rythme:
  question_par_jour: 1         # 1 question par jour, la même pour le couple
  par_partenaire: 1            # chacun répond de son côté — 1 question par jour chacun
  croisee: true                # le même énoncé des deux côtés — condition des réponses croisées
  revelation: "après double réponse uniquement — révélation mutuelle consentie"
consentement:
  modele: double-par-question  # les deux répondent avant que quoi que ce soit se révèle (SIG-8.1-02)
  revocabilite: a-tout-moment  # avant ET après révélation — la vue partagée se met à jour (forme exacte À VALIDER PAR LE COMITÉ)
signatures: [SIG-8.1-01, SIG-8.1-02]
chiffrement: renforce          # texte libre personnel — RGPD renforcé
export: jamais                 # aucune réponse dans les exports, le résumé d'engagement ou toute vue au-delà des deux
sortie: permanente             # toute réponse modifiable ou supprimable à tout moment
tiers: aucun                   # aucune révélation hors du couple, aucun croisement exposé
scoring:
  moteur: seul                 # tout le calcul vit côté moteur — zéro rendu
  compatibilite_reelle:
    nlp: "P2"                  # analyse de texte libre — phase P2 (doctrine produit)
    rendu: "jamais avant calibration comité"   # ⛔ VERROU DUR — interdit mission explicite
    croisement: "post-niveau-3"                # les 36 × 2 complétées avant tout calcul
  alimente: "moteur North Star (post-match) — conversion match → conversation → relation"
miroir: exempte-documentee     # précédent 6.4 — voir 07
cartes: aucune                 # les cartes individuelles n'existent pas dans M11 — voir 04
items: 36                      # 36 + 6 + 3 + 1 = 46 items M11 (Constitution [5]) ✓
niveaux:
  "1": 12                      # Q8.1-01 → 12 — le léger (sans aucune vulnérabilité)
  "2": 12                      # Q8.1-13 → 24 — le profond (personnel profond)
  "3": 12                      # Q8.1-25 → 36 — la vulnérabilité mutuelle (assumée à deux)
