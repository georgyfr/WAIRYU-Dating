# FICHE DE COMPUTATION COMPLÈTE — QUÊTE 5.5 (modèle des 8 items carte)
# Item choisi : Q5.5-01 (le volume qui monte — l'angle le plus parlant du profil explosif).
# Fichier YAML strict (gabarit des 8 items : seuls énoncé, profil, orientation et ancrage changent).
# 💎 PREMIUM · P1.5 · accès libre au sein du territoire premium
# SIG-5.5-02 (croisement explosif × fermé — cycle poursuite-retrait) : MOTEUR SEUL — jamais au rendu.
# SIG-5.5-03 (explosif × impulsivité = DGR composée) : MOTEUR SEUL — jamais au rendu.
# ═══════════════════════════════════════════════════════════════════
quete: "5.5 Quand la tension monte"
monde: M7                     # métadonnée — le code reste la clé (FM-011 v2)
statut_freemium: premium
phase: P1.5
acces: libre_territoire_premium
format: likert5               # échelle 1-5 codée 1-5
enonce: "Quand la tension monte, les mots sortent plus fort que moi."
echelle: "1 Pas du tout comme moi · 2 Plutôt pas comme moi · 3 Neutre / je ne sais pas · 4 Plutôt comme moi · 5 Tout à fait comme moi"
orientation: D                # direct — le bord « réaction pleine » (l'I de la paire, Q5.5-02, se recode 6−r)
dimension: explosif           # profil 1/4 (paire R6 avec Q5.5-02)
type_mesure: expression_declarative # déclarative — aucune trame hébergée par 5.5
double_balise:
  carte_id: coeur_5.5         # alimente la carte (4 variantes) et le miroir (4 profils)
  signal_id: SIG-5.5-01       # « Ta température » — profil d'expression (rendu conversationnel)
  signal_moteur: SIG-5.5-02   # [MOTEUR SEUL] — croisement explosif × fermé côté matching
                              # (cycle poursuite-retrait — le plus destructeur documenté,
                              # refonte l. 704) : jamais au rendu, jamais en UI, jamais au
                              # match affiché ; seuil et poids À VALIDER PAR LE COMITÉ
  signal_moteur_2: SIG-5.5-03 # [MOTEUR SEUL] — explosif × impulsivité (Monde 1, 1.4/3.4)
                              # = DGR composée (dictionnaire [4] ; refonte l. 2059) :
                              # aucune restitution, aucun badge, aucun score exposé ;
                              # condition, seuil et poids À VALIDER PAR LE COMITÉ
dimensions_de_la_quete:       # les 4 profils — libellés UI régistre courant obligatoires
  - code: explosif            # items Q5.5-01 × 02 · libellé UI : « Tu exploses »
  - code: ferme               # items Q5.5-03 × 04 · libellé UI : « Tu te fermes »
  - code: verbalise           # items Q5.5-05 × 06 · libellé UI : « Tu verbalises à froid »
  - code: sombre              # items Q5.5-07 × 08 · libellé UI : « Tu sombres »
computation:
  carte:
    role: profil_affiche
    regle: >-
      4 moyennes de profil (2 items chacune, I recodés 6−r, normalisées 0-1) — routage d'AFFICHAGE
      des 4 variantes (« Ta température » — un profil par température dominante ; ex æquo strict →
      départage à la 1ʳᵉ position de passation, conventions SIG-5.2-01, proposition À VALIDER PAR
      LE COMITÉ [9]) — aucune agrégation au score de compatibilité depuis cette quête
    rendu: etage_1_et_2        # carte (4 variantes) + miroir (4 profils)
  signal:
    role: temperature_conversationnelle
    mecanisme: >-
      SIG-5.5-01 — le profil raconte comment la tension sort de toi et à quel prix, jamais
      un verdict. Doctrine des températures : aucune hiérarchie entre profils — l'explosif
      n'est pas « pire » que le fermé ; zéro pathologisation, zéro silence traité en défaut.
      Tension commune (gelée) : « la tension monte chez tout le monde — la question n'est
      pas si, c'est comment et à quel prix » (registre probabiliste, sans absolu)
    rendu: etage_2             # miroir + carte
  fiabilite:
    role: paire_R6
    regle: >-
      |D_k − (6 − I_k)| >= 3 (recherche documentée) -> drapeau fiabilité sur le profil,
      rappel en toutes lettres, moyenne de profil = items valides + prudence
      (precedent SIG-2.1-02) ; 4 paires R6 completes (01x02 · 03x04 · 05x06 · 07x08)
  modulation:
    - si: "paire R6 divergente sur un profil"
      effet: "profil mis en prudence à l'affichage — le rappel raconte les deux réponses sans jugement"
    - si: "EXPLOSIF élevé (5.5) × FERME élevé (5.5) côté matching"
      effet: "SIG-5.5-02 [MOTEUR SEUL] — accompagnement du cycle écrit au ledger ; AUCUN texte, AUCUN badge, AUCUN score, AUCUNE exclusion de match ; seuil et poids À VALIDER PAR LE COMITÉ"
    - si: "EXPLOSIF élevé (5.5) × impulsivité (Monde 1, quêtes 1.4/3.4)"
      effet: "SIG-5.5-03 [MOTEUR SEUL] — DGR composée (dictionnaire [4]) écrite au ledger : aucune restitution, aucun badge, aucun score exposé ; condition, seuil et poids À VALIDER PAR LE COMITÉ"
  ancrage:
    rappel_autorise: true
    forme: "en toutes lettres, 2e personne — la réaction décrite, jamais jugée, jamais un code"
    exemple: "quand tu as dit que les mots sortent plus fort que toi"
notes:
  - >-
    Ce modèle sert de gabarit aux 8 items carte. Seuls changent : énoncé, profil (les 4 codes
    ci-dessus), orientation (recodage 6−r pour les I : 02 · 04 · 06 · 08), ancrage.
  - >-
    💎 PREMIUM — premium change ZÉRO chose au contenu (Constitution [6]) : l'écran d'intro
    n'anticipe aucun autre contenu ; badge visible au 00-README et à l'entête de complétion.
  - >-
    Références scientifiques (concepts publics, libres) : typologies d'expression de la
    colère + concept du pattern poursuite-retrait — noms de sources et nom anglais du
    pattern INTERDITS partout ; le nom français du cycle ne franchit jamais le rendu
    (05/07/cartes/écrans). Référence consignée aux fichiers moteur seulement (00/01/03/06).
  - >-
    « Somatisation » (refonte l. 702) : INTERDIT au rendu — rendu « le corps qui suit »
    (Q5.5-07, miroir, carte). Le terme clinique ne vit que dans les fichiers moteur.
  - >-
    AUCUNE trame hébergée par 5.5 : le DGR est un CROISEMENT de scores (pas une trame) —
    zéro signal ▲, zéro position réservée ; c2/c3 du mélange SANS-OBJET.
  - >-
    Mélange 5.5 : outil générique melange.py, graine 255427 (210427 + 1000 × ordinal 45),
    course de contrôle documentée au 02-plan (sonde hors dépôt, 5 passes identiques,
    empreinte 29b4741031f823ab3f2a03402838f44e) — config canonique ci/quetes/5.5.json
    À CRÉER par la session principale.
