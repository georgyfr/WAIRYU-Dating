# LIVRABLE 6 — FICHE DE COMPUTATION COMPLÈTE D'UN ITEM (modèle des 5 canaux)
# Item choisi : Q1.9-01 (autonomie — l'ancre d'état la plus directe de la quête).
# Fichier YAML strict (gabarit des 7 autres items : seuls énoncé, besoin, orientation et ancrage changent).
item: Q1.9-01
quete: "1.9 Ton élan du moment"
monde: M2                     # métadonnée — le code reste la clé (FM-011 v2)
statut_freemium: gratuit
format: likert5               # Arbitrage 2 — échelle 1-5 codée 1-5
enonce: "En ce moment, mes journées ressemblent à mes choix."
echelle: "1 Pas du tout comme moi · 2 Plutôt pas comme moi · 3 Neutre / je ne sais pas · 4 Plutôt comme moi · 5 Tout à fait comme moi"
orientation: D                # direct — contribue tel quel au score de son besoin
dimension: autonomie          # besoin n°1/3 (état du moment)
type_mesure: etat             # ÉTAT ≠ TRAIT : ré-évaluable tous les 30 jours, jamais un trait
double_balise:
  carte_id: etat_elan_1.9     # carte UNIQUE d'état (non sélective) — voir cartes.yaml
  signal_id: SIG_ÉLAN_FAIBLE  # moteur seul — rythme doux de l'app ; aucune trame dans la quête
interdictions:
  score_matching: true        # règle absolue : JAMAIS au score, JAMAIS au matching
  flux_lecture: "expérience + rétention interne exclusivement"
computation:
  carte: null                 # aucun score de quête : la carte unique est d'état, non sélective
  signal:
    role: adaptation_experience
    mecanisme: >-
      les trois besoins (autonomie, compétence, affiliation) composent l'élan du moment ;
      >= 2 besoins < 0.35 -> SIG_ÉLAN_FAIBLE -> rythme doux de l'app (flux rétention interne)
    rendu: moteur_seul        # aucun texte sur l'état, aucune mention du mécanisme
    condition: ">= 2 besoins < 0.35 — bornes reprises FM-019, provisoire concepteur"
  fiabilite:
    role: etat_longitudinal
    regle: >-
      fiabilité par temps de réponse (drapeau QFI) + ré-administration 30 jours
      (concordance des états) — PAS de paire miroir stricte (état ≠ trait, cadrage 00-README)
  modulation:
    - si: "ré-administration < 30 jours"
      effet: "passation refusée gentiment — on mesure une météo, pas ses oscillations"
    - si: "élan remonté à la re-passation"
      effet: "rythme standard rendu, sans récompense ni commentaire"
    - si: "divergence forte entre deux états à 30 jours"
      effet: "pas une incohérence : une vie qui bouge — aucune conséquence rendue"
  ancrage:
    rappel_autorise: true
    forme: "en toutes lettres, 2e personne, ancre temporelle d'état systématique (« en ce moment »)"
    exemple: "quand tu as répondu que tes journées ressemblent à tes choix"
notes:
  - >-
    Ce modèle sert de gabarit pour les 8 items. Seuls changent : énoncé, besoin (autonomie /
    compétence / affiliation), orientation (recodage 6−r pour les I), ancrage de rappel.
  - >-
    Aucune fiche de trame n'existe pour cette quête : aucun énoncé réservé, aucune balise de trame
    — vérifié au registre (n_trames = 0).
