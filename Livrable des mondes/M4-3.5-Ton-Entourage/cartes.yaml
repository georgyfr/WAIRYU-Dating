# ═══════════════════════════════════════════════════════════════════
# CARTES DE LA QUÊTE 3.5 « TON ENTOURAGE » — 3 VARIANTES (étage 1)
# Création : mission V9.E (2026-09-29).
# Charte des cartes C1-C11 (mission VAGUE 5) — longueur standard 55-110 mots
# (portrait + ombre + tension), vérifiée machine (script hors dépôt).
# Sélection : poids de l'entourage ENTOUR_D — partition exclusive + exhaustive
# de 0 à 1 (C6, vérifiée machine). NEUTRALITÉ ABSOLUE : les trois places se
# valent — le fusionnel n'est pas collé, l'indépendant n'est pas distant.
# Zéro personne nommée, aucun code, aucun sigle au rendu.
# ═══════════════════════════════════════════════════════════════════

quete: "3.5 Ton entourage"
monde: M4
statut_freemium: gratuit
format: "etage_1_carte"
charte: "C1-C11 (mission VAGUE 5) — longueur standard 55-110 mots (portrait + ombre + tension)"

selection:
  variable: "poids de l'entourage ENTOUR_D (moyenne des 6 items, I recodés 6−r, normalisée 0-1) — Q3.5-01 → Q3.5-06, aucune trame dans la quête"
  logique: "ENTOUR_D > 0.65 → fusionnel (la table élargie) · 0.35-0.65 → équilibre (le milieu du gué) · < 0.35 → indépendant (le tête-à-tête gardé)"
  bornes: "faible < 0.35 · central 0.35-0.65 · élevé > 0.65 — reprises des zones moteur ADOPTÉES (FM-019), provisoire concepteur — re-signature professionnelle avant bêta"
  exhaustivite: "3 plages = partition totale de [0,1] — chaque profil tombe dans exactement une variante (C6, vérifié machine)"
  non_participant: "l'écart à l'autre (EC_ENTOUR, SIG-3.5-02) ne participe JAMAIS à la sélection — friction conversationnelle moteur seul"

# Rendu de l'écran de complétion (structure du gabarit standard) :
#   entête → titre de variante → portrait → « Ta zone d'ombre : » → « Ta tension intérieure : »
#   → pied ({X}% compteur réel · {Z} personnes · boutons · {fenêtre sur l'autre})
entete_ecran: "🏡 QUÊTE ACCOMPLIE — « Ton entourage »"
label_ombre: "Ta zone d'ombre :"
label_tension: "Ta tension intérieure :"
pied_ecran: "📊 Ton profil de voyage : {X}% complété · 🤝 {Z} personnes attendent en ce moment un profil aussi riche que le tien. · [Partager ma carte] · [Quête suivante] · {fenêtre sur l'autre}"
fenetre_sur_l_autre:
  - "F1 : Quelque part, quelqu'un répond à ces mêmes questions. Le jour où vos cartes se croiseront, elles auront beaucoup à se dire."
  - "F2 : Ce portrait n'est pas une fin — c'est ta façon d'être trouvé·e : par quelqu'un qui lira ta carte avant ton visage."

variantes:

  - id: CARTE-3.5-TABLE-ELARGIE
    nom: "Le·La Table élargie"
    ordre_selecteur: 1
    condition: "ENTOUR_D > 0.65 (fusionnel)"
    ancre_item: ["Q3.5-01", "Q3.5-02", "Q3.5-03", "Q3.5-04", "Q3.5-05", "Q3.5-06"]
    portrait: "Ta famille et tes amis tiennent une vraie place : les décisions se prennent avec eux, les week-ends accueillent le cercle. Ta table s'élargit et tu y es bien — ton entourage est un filet, personne ne tombe."
    ombre: "La table qui déborde impose ses chaises : qui t'aime doit gagner sa place. Les fêtes, les dimanches et les devoirs se négocient tôt, à deux."
    tension_interieure: "élargir ta table, en préparant la chaise de la personne qui arrive."

  - id: CARTE-3.5-DEUX-RIVES
    nom: "Le·La Rive des deux camps"
    ordre_selecteur: 2
    condition: "ENTOUR_D entre 0.35 et 0.65 (équilibre)"
    ancre_item: ["Q3.5-01", "Q3.5-02", "Q3.5-03", "Q3.5-04", "Q3.5-05", "Q3.5-06"]
    portrait: "Ton entourage tient sa place, ni plus ni moins : il compte et il n'envahit pas. Tu connais la valeur des deux rives : la famille d'un côté, le couple de l'autre. Les amis au milieu — et toi qui fais le pont."
    ombre: "Le pont reçoit les vagues des deux rives : qui partage ta vie te confie les négociations. Ta règle des fêtes se dit — elle ne se devine pas."
    tension_interieure: "faire le pont, en disant ta règle des fêtes avant que la vague arrive."

  - id: CARTE-3.5-TERRITOIRE
    nom: "Le·La Territoire gardé"
    ordre_selecteur: 3
    condition: "ENTOUR_D < 0.35 (indépendant)"
    ancre_item: ["Q3.5-01", "Q3.5-02", "Q3.5-03", "Q3.5-04", "Q3.5-05", "Q3.5-06"]
    portrait: "Tes décisions se prennent entre vous, tes week-ends se réservent, la famille et le couple gardent chacun leur territoire. C'est une géographie choisie, pas une coupure — ta clarté est un don."
    ombre: "Le territoire protège et questionne : la famille de l'autre cherche sa place — elle se nomme, ou elle se devine mal."
    tension_interieure: "garder ton territoire, en nommant la place que les autres peuvent habiter."

regles_documentees:
  - "comptage des mots : tokens contenant au moins une lettre, champ = portrait + ombre + tension_interieure — bornes standard 55-110, vérifié machine (script hors dépôt)"
  - "neutralité absolue : les 3 variantes se valent — le fusionnel jamais « collé », l'indépendant jamais « distant », l'équilibre jamais « tiède » (contrôles machine)"
  - "zéro personne nommée : la famille se parle en situations (la chaise, les fêtes, les dimanches), jamais en personnages"
  - "la différenciation n'est pas l'indépendance — aucun degré de maturité attribué (verrou 04 n° 4)"
  - "SIG-3.5-02 (écart à l'autre) ne participe ni à la sélection ni au rendu — friction générique moteur seul"
  - "registre probabiliste : aucun futur certain (« se négocient », « se devine » — présent fréquentiel)"
  - "C4 : aucun superlatif — aucune place dressée en idéal"
  - "C8 : point médian dans les titres genrés · « (e) » dans le corps · métaphores d'objet exemptées du médian (précédent VAGUE 5)"
  - "le pied standard ({X}% compteur réel · {Z} personnes · boutons · fenêtre rotative F1/F2) suit le gabarit de la mission Production 4"
