# LIVRABLE 6 — FICHE DE COMPUTATION COMPLÈTE D'UN ITEM (modèle des 5 canaux)
# Item choisi : Q3.1-01 (le pic d'énergie côté matin — l'angle le plus direct de la matinalité).
# Fichier YAML strict (gabarit des 4 autres items : seuls énoncé, angle, orientation et ancrage changent).
item: Q3.1-01
quete: "3.1 Ton rythme de vie"
monde: M4                     # métadonnée — le code reste la clé (FM-011 v2)
statut_freemium: gratuit
format: likert5               # Arbitrage 2 — échelle 1-5 codée 1-5
enonce: "Je fonctionne au mieux quand le jour se lève."
echelle: "1 Pas du tout comme moi · 2 Plutôt pas comme moi · 3 Neutre / je ne sais pas · 4 Plutôt comme moi · 5 Tout à fait comme moi"
orientation: D                # direct — contribue tel quel à l'axe de matinalité
dimension: pic_energie        # angle 1/3 : le pic d'énergie (paire R6 avec Q3.1-02)
type_mesure: trait_declaratif # déclarative directe — déguisement impossible, sans trame
double_balise:
  carte_id: rythme_3.1        # alimente la carte (3 variantes) et le miroir (3 profils) + badge 🌅/🦉
  signal_id: SIG-3.1-01       # le profil (blocs de matinalité) — rendu descriptif, jamais un grade
computation:
  carte:
    role: score_de_quete
    regle: "CHRONO_D = moyenne des 5 items (I recodés 6−r), normalisée 0-1 — choisit la variante (matinal/intermédiaire/nocturne)"
    rendu: etage_1_et_2        # carte (3 variantes) + miroir (3 profils) + badge des extrêmes
  signal:
    role: profil_rythme
    mecanisme: >-
      le profil par blocs (SIG-3.1-01) décrit l'heure où la personne est à soi ; l'écart entre
      deux profils (EC_CHRONO, SIG-3.1-02) prépare des amorces conversationnelles — « vos
      meilleurs moments communs », la friction des agendas — jamais une pénalité dure, jamais
      une élimination, jamais un score rendu
    rendu: moteur_seul         # l'écart calculé n'est jamais rendu à un membre
    condition: "seuils blocs et seuil d'écart proposés — À VALIDER PAR LE COMITÉ [9]"
  fiabilite:
    role: paire_R6
    regle: >-
      |D_k − (6 − I_k)| >= 3 (recherche documentée) -> drapeau fiabilité sur l'angle,
      rappel en toutes lettres, score d'angle = moyenne des items valides + prudence
      (precedent SIG-2.1-02) ; le pivot Q3.1-05 (mono) repose sur la cohérence d'axe + QFI
  modulation:
    - si: "paire R6 divergente sur un angle"
      effet: "angle mis en prudence au score — le rappel raconte les deux réponses sans reproche"
    - si: "écart de rythme fort entre deux profils (EC_CHRONO > seuil — À VALIDER PAR LE COMITÉ)"
      effet: "amorce conversationnelle « vos meilleurs moments communs » préparée côté moteur — jamais de pénalité, jamais d'élimination"
    - si: "mise à jour d'un profil du pool"
      effet: "compatibilités recalculées des deux côtés — fenêtre À VALIDER PAR LE COMITÉ"
  ancrage:
    rappel_autorise: true
    forme: "en toutes lettres, 2e personne — le rythme décrit, jamais une discipline, jamais un code"
    exemple: "quand tu as répondu fonctionner au mieux quand le jour se lève"
notes:
  - >-
    Ce modèle sert de gabarit pour les 5 items. Seuls changent : énoncé, angle (pic d'énergie /
    horloge libre / heures calmes), orientation (recodage 6−r pour les I), ancrage.
  - >-
    Quête déclarative directe, déguisement impossible : aucune fiche de trame n'existe — aucun
    énoncé réservé, aucune balise de trame (vérifié au registre, n_trames = 0).
  - >-
    Anti-normativité : le recodage 6−r place les deux bouts de chaque paire sur le même axe sans
    les hiérarchiser (précédent 2.2) — l'oiseau de nuit n'est pas un défaut.
