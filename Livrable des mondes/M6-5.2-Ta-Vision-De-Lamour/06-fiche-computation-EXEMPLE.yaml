# ═══════════════════════════════════════════════════════════════════
# FICHE DE COMPUTATION COMPLÈTE — QUÊTE 5.2 (modèle des 8 items carte)
# Item choisi : Q5.2-01 (l'évidence — l'angle le plus parlant de l'axe destin).
# Fichier YAML strict (gabarit des 8 items : seuls énoncé, axe, orientation et ancrage changent).
# 💎 PREMIUM · P1.5 · accès libre au sein du territoire premium
# SIG-5.2-02 (pénalité destin extrême × évitant) : MOTEUR SEUL — jamais au rendu.
# ═══════════════════════════════════════════════════════════════════
quete: "5.2 Ta vision de l'amour"
monde: M6                     # métadonnée — le code reste la clé (FM-011 v2)
statut_freemium: premium
phase: P1.5
acces: libre_territoire_premium
format: likert5               # Arbitrage 2 — échelle 1-5 codée 1-5
enonce: "Ce qui doit arriver pour moi finit par arriver."
echelle: "1 Pas du tout comme moi · 2 Plutôt pas comme moi · 3 Neutre / je ne sais pas · 4 Plutôt comme moi · 5 Tout à fait comme moi"
orientation: D                # direct — le bord « croyance pleine » (l'I de la paire, Q5.2-02, se recode 6−r)
dimension: destin             # axe 1/4 (paire R6 avec Q5.2-02)
type_mesure: croyance_declarative # déclarative — aucune trame hébergée par 5.2
double_balise:
  carte_id: coeur_5.2         # alimente la carte (4 variantes) et le miroir (4 profils)
  signal_id: SIG-5.2-01       # profil de croyances + slot probabiliste (rendu conversationnel)
  signal_moteur: SIG-5.2-02   # [MOTEUR SEUL] — pénalité destin extrême × évitant (Monde 1) :
                              # jamais au rendu, jamais en UI, jamais au match affiché ;
                              # condition (T=0.75 provisoire) et poids (0.10 provisoire)
                              # À VALIDER PAR LE COMITÉ
dimensions_de_la_quete:       # les 4 axes — libellés UI génériques obligatoires
  - code: destin              # items Q5.2-01 × 02 · libellé UI : « le destin »
  - code: coup_de_foudre      # items Q5.2-03 × 04 · libellé UI : « le coup de foudre »
  - code: grand_amour_unique  # items Q5.2-05 × 06 · libellé UI : « le grand amour unique »
  - code: idealisation        # items Q5.2-07 × 08 · libellé UI : « l'idéalisation »
computation:
  carte:
    role: profil_affiche
    regle: >-
      4 moyennes d'axe (2 items chacune, I recodés 6−r, normalisées 0-1) — routage d'AFFICHAGE
      des 4 variantes (un profil par axe dominant ; ex æquo strict → départage à la 1ʳᵉ position
      de passation, proposition À VALIDER PAR LE COMITÉ [9]) — aucune agrégation au score de
      compatibilité depuis cette quête
    rendu: etage_1_et_2        # carte (4 variantes) + miroir (4 profils)
  signal:
    role: slot_probabiliste
    mecanisme: >-
      SIG-5.2-01 — le profil raconte un rapport au temps de l'amour (attendre vs construire ·
      saisir vs reconnaître · mythe vs quotidien · image vs présence). Zéro verdict, zéro
      prédiction, zéro correction de croyance : « la suite te dira si tu attends ou si tu
      construis » (matière gelée refonte l. 1813)
    rendu: etage_2             # miroir + carte
  fiabilite:
    role: paire_R6
    regle: >-
      |D_k − (6 − I_k)| >= 3 (recherche documentée) -> drapeau fiabilité sur l'axe,
      rappel en toutes lettres, moyenne d'axe = items valides + prudence
      (precedent SIG-2.1-02) ; 4 paires R6 completes (01x02 · 03x04 · 05x06 · 07x08)
  modulation:
    - si: "paire R6 divergente sur un axe"
      effet: "axe mis en prudence à l'affichage — le rappel raconte les deux réponses sans jugement"
    - si: "DESTIN extrême (moyenne > T=0.75 provisoire) × évitant (Monde 1)"
      effet: "SIG-5.2-02 [MOTEUR SEUL] — signal d'attente accompagnée écrit au ledger ; AUCUN texte, AUCUN badge, AUCUN score exposé — le premier conflit y est anticipé comme étape fragile, jamais comme faute ; condition et poids À VALIDER PAR LE COMITÉ"
  ancrage:
    rappel_autorise: true
    forme: "en toutes lettres, 2e personne — la croyance décrite, jamais jugée, jamais un code"
    exemple: "quand tu as dit que ce qui doit arriver finit par arriver"
notes:
  - >-
    Ce modèle sert de gabarit aux 8 items carte. Seuls changent : énoncé, axe (les 4 codes
    ci-dessus), orientation (recodage 6−r pour les I : 02 · 04 · 06 · 08), ancrage.
  - >-
    💎 PREMIUM — premium change ZÉRO chose au contenu (Constitution [6]) : l'écran d'intro
    n'anticipe aucun autre contenu ; badge visible au 00-README et à l'entête de complétion.
  - >-
    Typologie de référence des croyances de relation (concept public, libre) : le nom de la
    typologie et de ses auteures est INTERDIT au rendu (05/07/cartes/écrans) — référence
    consignée aux fichiers moteur seulement (01/03/06).
  - >-
    Mélange 5.2 : outil générique melange.py, graine 252427 (gelée V11, re-prise à
    l'identique), verdicts réels au 02-plan — config canonique ci/quetes/5.2.json créée par
    la session principale.
  - >-
    2ᵉ génération (phase R, V12) — dossier V11 perdu au reset : texte réécrit, cadre gelé
    inchangé (spécification Task 21 du worklog).
