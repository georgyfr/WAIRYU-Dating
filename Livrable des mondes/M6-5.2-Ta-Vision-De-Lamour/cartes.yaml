# CARTES DE LA QUÊTE 5.2 « TA VISION DE L'AMOUR » — 4 VARIANTES (étage 1)
# 💎 PREMIUM · P1.5 · Création : phase R V12 — 2ᵉ génération (dossier V11 perdu au reset,
# rédaction neuve sur le cadre gelé — worklog Task 21).
# Charte des cartes C1-C11 (mission VAGUE 5) — longueur standard 55-110 mots
# (portrait + ombre + tension), vérifiée machine (script hors dépôt).
# Sélection : axe dominant (max des 4 moyennes d'axe, I recodés 6−r, normalisés) —
# ex æquo strict → départage à la 1ʳᵉ position de passation (proposition, comité) —
# partition exclusive + exhaustive (SIG-5.2-01, C6, vérifiée machine). Bornes À VALIDER
# PAR LE COMITÉ [9]. NEUTRALITÉ DES CROYANCES : aucun axe n'est un idéal — la carte
# décrit un film, elle ne le corrige pas (zéro verdict, zéro prédiction).
# SLOT PROBABILISTE (matière gelée refonte l. 1813) : « la suite te dira si tu attends
# ou si tu construis » — reprise à la carte destin ; ailleurs, registre probabiliste.
# SIG-5.2-02 (pénalité destin extrême × évitant) : [MOTEUR SEUL] — INVISIBLE au rendu ;
# aucune variante ci-dessous n'expose un croisement, un seuil ou un score.
# AUCUNE trame hébergée par 5.2 (quête 100 % carte) — rien à cacher, rien à masquer.
