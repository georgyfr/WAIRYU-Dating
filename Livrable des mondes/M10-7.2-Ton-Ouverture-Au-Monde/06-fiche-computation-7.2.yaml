# FICHE DE COMPUTATION — QUÊTE 7.2 « TON OUVERTURE AU MONDE » (modèle des 8 items carte)
# Item choisi : Q7.2-01 (l'énergie — l'angle le plus parlant de l'axe).
# Gabarit des 8 items : seuls énoncé, axe, orientation et ancrage changent.
# 💎 PREMIUM · P3 · accès libre au sein du territoire premium.
# SIG-7.2-01 (trait OUVERTURE) : MOTEUR SEUL — alimente la matrice 7.3,
# jamais au rendu. Zéro trame hébergée par M10 (▲ = « — » partout).
# ═══════════════════════════════════════════════════════════════════
quete: "7.2 Ton ouverture au monde"
monde: M10
statut_freemium: premium
phase: P3
acces: libre_territoire_premium
format: likert5               # Arbitrage 2 — échelle 1-5 codée 1-5
enonce: "Découvrir les habitudes d'un autre monde me donne de l'énergie."
echelle: "1 Pas du tout comme moi · 2 Plutôt pas comme moi · 3 Neutre / je ne sais pas · 4 Plutôt comme moi · 5 Tout à fait comme moi"
orientation: D                # direct — l'I de la paire (Q7.2-02) se recode 6−r
dimension: energie            # axe 1/4 (paire R6 avec Q7.2-02)
type_mesure: aisance_declarative    # déclaratif — aucune trame hébergée par M10
double_balise:
  carte_id: monde_7.2         # alimente la carte (3 zones) et le miroir (3 variantes)
  signal_id: SIG-7.2-01       # trait OUVERTURE — moyenne des 4 axes (rendu conversationnel)
  signal_moteur: SIG-7.3-01   # [MOTEUR SEUL] — matrice ANCRAGE × OUVERTURE (7.3) :
                              # jamais au rendu ; seuils À VALIDER PAR LE COMITÉ
dimensions_de_la_quete:       # les 4 axes — libellés UI génériques obligatoires
  - code: energie             # items Q7.2-01 × 02 · libellé UI : « l'énergie de la découverte »
  - code: apprentissage       # items Q7.2-03 × 04 · libellé UI : « l'apprentissage »
  - code: malentendu          # items Q7.2-05 × 06 · libellé UI : « le malentendu »
  - code: accueil             # items Q7.2-07 × 08 · libellé UI : « l'accueil » (composition Wairyu [9])
computation:
  carte:
    role: zone_trait
    regle: >-
      moyenne OUVERTURE (4 axes, 0-1) → 3 zones : ≤ 0.35 → kit BAS (complet) · 0.35-0.65 →
      SYN (seule) · ≥ 0.65 → kit HAUT (complet) — règle des 3 niveaux (refonte, chaque pôle a
      deux faces) ; seuils À VALIDER PAR LE COMITÉ [9]
    rendu: etage_1_et_2        # carte (3 zones) + miroir (3 variantes)
  signal:
    role: trait_ouverture
    mecanisme: >-
      SIG-7.2-01 — OUVERTURE = moyenne des 4 axes (0-1). IMPÉRATIF DE DIGNITÉ GRAVÉ :
      l'ouverture faible est un RYTHME, pas un défaut — aucune lecture de manque au rendu
      (test de réécriture gravé au 07). Il alimente la matrice interculturelle SIG-7.3-01 —
      MOTEUR SEUL.
    rendu: etage_2             # miroir + carte, conversationnel
  fiabilite:
    role: paire_R6
    regle: >-
      |D_k − (6 − I_k)| >= 3 (recherche documentée) -> drapeau fiabilité sur l'axe,
      rappel en toutes lettres ; 4 paires R6 complètes (01x02 · 03x04 · 05x06 · 07x08)
  modulation:
    - si: "paire R6 divergente sur un axe"
      effet: "axe mis en prudence à l'affichage — le rappel raconte les deux réponses sans jugement"
  ancrage:
    rappel_autorise: true
    forme: "en toutes lettres, 2e personne — l'aisance décrite, jamais notée, jamais un code"
    exemple: "quand tu as dit que découvrir un autre monde te donne de l'énergie"
notes:
  - >-
    Cadre de dignité Monde 7 (refonte l. 1380-1385) : on mesure l'aisance avec l'altérité,
    jamais une origine ; l'axe « accueil » est une composition Wairyu documentée (domaine
    réservé [9]) ancrée à la source « l'aisance avec l'altérité ».
  - >-
    Mélange 7.2 : outil générique melange.py, graine 272427 = 210427 + 1000 × ordinal 62
    (convention concaténée, (7−1)×10+2) — coordination M11 consignée au 02-plan (place de
